name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: nothing in this workflow writes to the repo, checks, or packages.
permissions:
  contents: read

# One run per ref; a newer push cancels the stale one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift:
    name: Swift test and release build (macOS 26)
    # macos-26 (arm64) hosted image: Xcode 26.6 is the image default; 26.4.1 is
    # also installed. The image default is used as-is (no xcode-select).
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Print toolchain versions
        run: |
          xcodebuild -version
          swift --version

      - name: Run tests
        run: swift test

      - name: Build release
        run: swift build -c release

  shellcheck:
    name: ShellCheck scripts
    # shellcheck ships preinstalled on ubuntu-24.04; the macOS image has none.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint shell scripts
        run: |
          shellcheck --version
          shellcheck scripts/*.sh
