<svg xmlns="http://www.w3.org/2000/svg" width="880" height="800" viewBox="0 0 880 800" role="img" aria-labelledby="la-title la-desc">
  <title id="la-title">Insomnia lid actions during a session</title>
  <desc id="la-desc">An illustrated excerpt of the Lid-close actions section in Settings, with the defaults, connected by arrows to what happens when the lid closes and opens during a session. The Freeze while the lid is closed list contains Slack, WhatsApp and Discord. Pause Docker Desktop when no containers are running is on. Mute audio on lid close is off. When the lid closes, the listed apps are frozen with SIGSTOP after a journal entry is written; Docker Desktop is paused only if an idle check finds no containers running, and a container that is still starting can race that check; if muting is on, the volume is saved and audio is muted. When the lid opens, Insomnia attempts to undo the lid actions: it resumes only the freezes it can verify it made, resumes Docker if the rule paused it, and restores the saved audio. The session continues; the timer never stopped, only its on-screen redraw paused. This repeats every time the lid closes and opens. Without an active session the lid does nothing.</desc>
  <style>
    svg { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Helvetica, Arial, sans-serif; }
    .bg { fill: #F4F3FA; }
    .panel { fill: #FFFFFF; stroke: #D3D1E4; stroke-width: 1.5; }
    .chip { fill: #ECEAF6; stroke: #D3D1E4; stroke-width: 1.5; }
    .sep { stroke: #D3D1E4; stroke-width: 1.5; }
    .t { fill: #11151F; }
    .m { fill: #4F5368; }
    .a { fill: #6257A5; }
    .ln { fill: none; stroke: #6257A5; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    .ic { fill: none; stroke: #11151F; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .hdr-moon { fill: #11151F; }
    .knob { fill: #FFFFFF; }
    .on { fill: #6257A5; }
    .off { fill: #C4C2D6; }
    .remove { fill: #9A9DB2; }
    .minus { fill: none; stroke: #FFFFFF; stroke-width: 2.4; stroke-linecap: round; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #06012C; }
      .panel { fill: #11151F; stroke: #2E3346; }
      .chip { fill: #1B2030; stroke: #363C52; }
      .sep { stroke: #2E3346; }
      .t { fill: #EEF0F7; }
      .m { fill: #B4B8CC; }
      .a { fill: #9691D9; }
      .ln { stroke: #9691D9; }
      .ic { stroke: #EEF0F7; }
      .hdr-moon { fill: #EEF0F7; }
      .on { fill: #9691D9; }
      .off { fill: #3A4058; }
      .remove { fill: #6E7288; }
    }
  </style>
  <defs>
    <path id="la-eye" d="M1.5 12 C7 4.5 17 4.5 22.5 12 C17 19.5 7 19.5 1.5 12 Z"/>
    <path id="la-moon" d="M13.3625 8.1877 A4.2 4.2 0 1 0 13.3625 15.8123 A3.85 3.85 0 0 1 13.3625 8.1877 Z"/>
    <marker id="la-arrow" viewBox="0 0 14 14" markerWidth="14" markerHeight="14" refX="11" refY="7" markerUnits="userSpaceOnUse" orient="auto">
      <path class="a" d="M2 2 L12 7 L2 12 Z"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="880" height="800" rx="24"/>

  <!-- Header -->
  <g transform="translate(40 24) scale(1.6667)">
    <use href="#la-eye" class="ic" stroke-width="1.5"/>
    <use href="#la-moon" class="hdr-moon"/>
  </g>
  <text class="t" x="96" y="52" font-size="26" font-weight="700">What the lid does during a session</text>
  <text class="m" x="96" y="82" font-size="20">Lid actions run only while a session is active. Defaults shown.</text>

  <!-- Settings excerpt (illustration) -->
  <g>
    <rect class="panel" x="40" y="112" width="400" height="428" rx="18"/>
    <text class="t" x="64" y="150" font-size="22" font-weight="700">Lid-close actions</text>
    <text class="t" x="64" y="190" font-size="20" font-weight="600">Freeze while the lid is closed</text>

    <text class="t" x="64" y="230" font-size="20">Slack</text>
    <circle class="remove" cx="404" cy="223" r="10"/>
    <path class="minus" d="M398 223 H410"/>
    <text class="t" x="64" y="272" font-size="20">WhatsApp</text>
    <circle class="remove" cx="404" cy="265" r="10"/>
    <path class="minus" d="M398 265 H410"/>
    <text class="t" x="64" y="314" font-size="20">Discord</text>
    <circle class="remove" cx="404" cy="307" r="10"/>
    <path class="minus" d="M398 307 H410"/>

    <path class="sep" d="M64 362 H416"/>

    <!-- Docker toggle: on -->
    <text class="t" x="64" y="418" font-size="20">Pause Docker Desktop when</text>
    <text class="t" x="64" y="444" font-size="20">no containers are running</text>
    <rect class="on" x="362" y="410" width="52" height="30" rx="15"/>
    <circle class="knob" cx="399" cy="425" r="12"/>

    <!-- Mute toggle: off -->
    <text class="t" x="64" y="505" font-size="20">Mute audio on lid close</text>
    <rect class="off" x="362" y="483" width="52" height="30" rx="15"/>
    <circle class="knob" cx="377" cy="498" r="12"/>
  </g>
  <text class="m" x="40" y="572" font-size="20">Illustrated Settings excerpt, not a screenshot.</text>

  <!-- Straight arrows from each setting to its lid-close entry -->
  <path class="ln" d="M446 265 H474" marker-end="url(#la-arrow)"/>
  <path class="ln" d="M446 425 H474" marker-end="url(#la-arrow)"/>
  <path class="ln" d="M446 498 H474" marker-end="url(#la-arrow)"/>

  <!-- Lid closes -->
  <g>
    <rect class="panel" x="480" y="112" width="360" height="428" rx="18"/>
    <g class="ic" transform="translate(500 130)">
      <rect x="2" y="16" width="36" height="8" rx="3"/>
      <path d="M8 11 H32"/>
    </g>
    <text class="t" x="552" y="154" font-size="24" font-weight="700">Lid closes</text>

    <text class="t" x="500" y="246" font-size="20" font-weight="600">Freezes the listed apps</text>
    <text class="m" x="500" y="272" font-size="20">SIGSTOP, journaled first.</text>
    <text class="m" x="500" y="298" font-size="20">Agent apps are excluded from this list.</text>

    <text class="t" x="500" y="418" font-size="20" font-weight="600">Pauses Docker if it looks idle</text>
    <text class="m" x="500" y="444" font-size="20">A starting container can race the check.</text>

    <text class="t" x="500" y="492" font-size="20" font-weight="600">Mutes audio, if turned on</text>
    <text class="m" x="500" y="518" font-size="20">Saves your volume first.</text>
  </g>

  <path class="ln" d="M660 540 V566" marker-end="url(#la-arrow)"/>

  <!-- Lid opens -->
  <g>
    <rect class="panel" x="480" y="570" width="360" height="212" rx="18"/>
    <g class="ic" transform="translate(500 586)">
      <rect x="8" y="2" width="24" height="17" rx="3"/>
      <rect x="2" y="22" width="36" height="6" rx="3"/>
    </g>
    <text class="t" x="552" y="612" font-size="24" font-weight="700">Lid opens</text>

    <text class="t" x="500" y="654" font-size="20" font-weight="600">Attempts to undo the lid actions</text>
    <text class="m" x="500" y="680" font-size="20">Resumes only freezes it can verify it</text>
    <text class="m" x="500" y="706" font-size="20">made, Docker if the rule paused it,</text>
    <text class="m" x="500" y="732" font-size="20">and the saved audio.</text>
    <text class="t" x="500" y="764" font-size="20" font-weight="600">The session continues.</text>
  </g>

  <!-- Loop back: repeats each time the lid closes again -->
  <path class="ln" d="M846 668 H862 V326 H846" stroke-dasharray="6 7" marker-end="url(#la-arrow)"/>

  <!-- Captions, left column -->
  <g class="ic">
    <circle cx="52" cy="628" r="11"/>
    <path d="M52 622 V628 H57"/>
  </g>
  <text class="t" x="76" y="635" font-size="20">The timer never stops while the lid is closed;</text>
  <text class="m" x="76" y="661" font-size="20">only its on-screen redraw pauses.</text>
  <g class="ic">
    <circle cx="52" cy="708" r="11"/>
    <path d="M44.5 700.5 L59.5 715.5"/>
  </g>
  <text class="t" x="76" y="715" font-size="20">No active session means no lid actions.</text>
  <text class="m" x="76" y="741" font-size="20">Repeats each time the lid closes again.</text>
</svg>
