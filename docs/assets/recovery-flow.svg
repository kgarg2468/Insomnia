<svg xmlns="http://www.w3.org/2000/svg" width="880" height="932" viewBox="0 0 880 932" role="img" aria-labelledby="rf-title rf-desc">
  <title id="rf-title">Insomnia recovery flow</title>
  <desc id="rf-desc">Every recoverable change is written to a recovery journal before it is made, and the app and the launchd backstop share one recovery lock. An illustrated example of the right-click menu shows what pending cleanup looks like: a warning line reading Sleep still held with no session, a machine status line, then Settings and Quit Insomnia; the warning is read from the journal. Two paths read the journal. The Insomnia app attempts cleanup right away when a session ends and again when it reopens. The launchd backstop runs every 60 seconds, leaves a valid unexpired session alone, and attempts recovery when the deadline is due, the session file is missing or invalid, or a run is forced. Both restore only what can be verified; failed or unreadable evidence stays on disk instead of being treated as clean. Two things may need your attention: saved audio is restored only by reopening the app, and an unconfirmed freeze means you should inspect the process yourself. The backstop undoes journaled changes only. It is not battery or thermal monitoring and cannot restore audio.</desc>
  <style>
    svg { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Helvetica, Arial, sans-serif; }
    .bg { fill: #F3F2EF; }
    .panel { fill: #FAF9F6; stroke: #DBD9D4; stroke-width: 1.5; }
    .chip { fill: #ECEAE6; stroke: #DBD9D4; stroke-width: 1.5; }
    .menu { fill: #F7F6F3; stroke: #CFCDC8; stroke-width: 1.5; }
    .sep { stroke: #DBD9D4; stroke-width: 1.5; }
    .t { fill: #292D30; }
    .m { fill: #5F6467; }
    .a { fill: #536D78; }
    .ln { fill: none; stroke: #536D78; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    .ic { fill: none; stroke: #292D30; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .hdr-moon { fill: #292D30; }
    .warn { fill: #A85A00; }
    .warn-ic { fill: none; stroke: #A85A00; stroke-width: 2.25; stroke-linecap: round; stroke-linejoin: round; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #242628; }
      .panel { fill: #303336; stroke: #3E4145; }
      .chip { fill: #383B3F; stroke: #474A4E; }
      .menu { fill: #383B3F; stroke: #4A4D51; }
      .sep { stroke: #4A4D51; }
      .t { fill: #E6E3DD; }
      .m { fill: #B5B7B8; }
      .a { fill: #A6BBC3; }
      .ln { stroke: #A6BBC3; }
      .ic { stroke: #E6E3DD; }
      .hdr-moon { fill: #E6E3DD; }
      .warn { fill: #F2A854; }
      .warn-ic { stroke: #F2A854; }
    }
  </style>
  <defs>
    <path id="rf-eye" d="M1.5 12 C7 4.5 17 4.5 22.5 12 C17 19.5 7 19.5 1.5 12 Z"/>
    <path id="rf-moon" d="M13.3625 8.1877 A4.2 4.2 0 1 0 13.3625 15.8123 A3.85 3.85 0 0 1 13.3625 8.1877 Z"/>
    <marker id="rf-arrow" viewBox="0 0 14 14" markerWidth="14" markerHeight="14" refX="11" refY="7" markerUnits="userSpaceOnUse" orient="auto">
      <path class="a" d="M2 2 L12 7 L2 12 Z"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="880" height="932" rx="24"/>

  <!-- Header -->
  <g transform="translate(40 24) scale(1.6667)">
    <use href="#rf-eye" class="ic" stroke-width="1.5"/>
    <use href="#rf-moon" class="hdr-moon"/>
  </g>
  <text class="t" x="96" y="52" font-size="26" font-weight="700">Two ways back to normal</text>
  <text class="m" x="96" y="82" font-size="20">Recoverable changes are journaled before they are made. One lock is shared.</text>

  <!-- Example right-click menu (illustration) -->
  <g>
    <rect class="menu" x="40" y="112" width="380" height="168" rx="12"/>
    <text class="warn" x="60" y="146" font-size="20">Sleep still held with no session</text>
    <text class="m" x="60" y="176" font-size="20">Lid: open · 87%</text>
    <path class="sep" d="M52 192 H408"/>
    <text class="t" x="60" y="224" font-size="20">Settings…</text>
    <text class="m" x="400" y="224" font-size="20" text-anchor="end">⌘,</text>
    <text class="t" x="60" y="258" font-size="20">Quit Insomnia</text>
    <text class="m" x="400" y="258" font-size="20" text-anchor="end">⌘Q</text>
  </g>
  <text class="m" x="40" y="310" font-size="20">Example right-click menu while cleanup is</text>
  <text class="m" x="40" y="336" font-size="20">still pending. Illustration, not a screenshot.</text>

  <!-- Shared journal and lock -->
  <g>
    <rect class="panel" x="460" y="112" width="380" height="188" rx="18"/>
    <g class="ic" transform="translate(484 134)">
      <rect x="1" y="1" width="22" height="28" rx="3"/>
      <path d="M7 9 H17 M7 15 H17 M7 21 H13"/>
    </g>
    <text class="t" x="520" y="156" font-size="24" font-weight="700">Recovery journal + lock</text>
    <text class="m" x="484" y="198" font-size="20">Each recoverable change is written</text>
    <text class="m" x="484" y="224" font-size="20">here before it is made. One lock</text>
    <text class="m" x="484" y="250" font-size="20">keeps the app and the backstop from</text>
    <text class="m" x="484" y="276" font-size="20">restoring over each other.</text>
  </g>

  <!-- The warning is read from the journal -->
  <path class="ln" d="M460 196 H426" marker-end="url(#rf-arrow)"/>

  <!-- Split to two paths -->
  <path class="ln" d="M650 300 V320 H440 V454 H424" marker-end="url(#rf-arrow)"/>
  <path class="ln" d="M650 320 V352" marker-end="url(#rf-arrow)"/>

  <!-- Path: app cleanup -->
  <g>
    <rect class="panel" x="40" y="356" width="380" height="212" rx="18"/>
    <g transform="translate(64 372) scale(1.3333)">
      <use href="#rf-eye" class="ic" stroke-width="1.5"/>
      <use href="#rf-moon" class="hdr-moon"/>
    </g>
    <text class="t" x="108" y="398" font-size="24" font-weight="700">Insomnia app</text>
    <text class="m" x="64" y="442" font-size="20">Attempts cleanup right away when</text>
    <text class="m" x="64" y="468" font-size="20">a session ends, and again when</text>
    <text class="m" x="64" y="494" font-size="20">the app reopens.</text>
  </g>

  <!-- Path: launchd backstop -->
  <g>
    <rect class="panel" x="460" y="356" width="380" height="212" rx="18"/>
    <g class="ic" transform="translate(484 374)">
      <circle cx="16" cy="16" r="13"/>
      <path d="M16 8 V16 H22"/>
    </g>
    <text class="t" x="528" y="398" font-size="24" font-weight="700">launchd backstop</text>
    <text class="m" x="484" y="442" font-size="20">Runs every 60 seconds and leaves a</text>
    <text class="m" x="484" y="468" font-size="20">valid, unexpired session alone.</text>
    <text class="m" x="484" y="494" font-size="20">Attempts recovery when the deadline</text>
    <text class="m" x="484" y="520" font-size="20">is due, the session file is missing</text>
    <text class="m" x="484" y="546" font-size="20">or invalid, or a run is forced.</text>
  </g>

  <!-- Converge -->
  <path class="ln" d="M230 568 V596 H650 V568"/>
  <path class="ln" d="M440 596 V624" marker-end="url(#rf-arrow)"/>

  <!-- Restore -->
  <g>
    <rect class="panel" x="40" y="628" width="800" height="90" rx="16"/>
    <text class="t" x="440" y="662" font-size="24" font-weight="700" text-anchor="middle">Restore what can be verified</text>
    <text class="m" x="440" y="694" font-size="20" text-anchor="middle">Failed or unreadable evidence stays on disk; it is never treated as clean.</text>
  </g>

  <!-- Attention branch -->
  <path class="ln" d="M440 718 V744" marker-end="url(#rf-arrow)"/>
  <g class="warn-ic">
    <path d="M285 754 L297 776 H273 Z"/>
    <path d="M285 762 V769"/>
    <path d="M285 772.5 V773"/>
  </g>
  <text class="warn" x="308" y="774" font-size="24" font-weight="700">May need your attention</text>

  <g>
    <rect class="chip" x="120" y="792" width="310" height="68" rx="16"/>
    <text class="t" x="140" y="820" font-size="20" font-weight="600">Saved audio</text>
    <text class="m" x="140" y="846" font-size="20">Only the app restores it: reopen it.</text>
  </g>
  <g>
    <rect class="chip" x="450" y="792" width="310" height="68" rx="16"/>
    <text class="t" x="470" y="820" font-size="20" font-weight="600">Unconfirmed freeze</text>
    <text class="m" x="470" y="846" font-size="20">Inspect the process yourself.</text>
  </g>

  <!-- Scope note -->
  <text class="m" x="40" y="890" font-size="20">The backstop undoes journaled changes only. It is not battery or thermal monitoring,</text>
  <text class="m" x="40" y="916" font-size="20">and it cannot restore audio.</text>
</svg>
