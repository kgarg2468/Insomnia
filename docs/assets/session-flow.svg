<svg xmlns="http://www.w3.org/2000/svg" width="880" height="600" viewBox="0 0 880 600" role="img" aria-labelledby="sf-title sf-desc">
  <title id="sf-title">Insomnia session flow in the menu bar</title>
  <desc id="sf-desc">Three menu bar states, each with an explanation. One, enter a duration: clicking the eye shows three pills labelled Days, Hours and Minutes, with Hours focused; you type digits, move between pills with Tab or the arrow keys, and press Enter to start. Two, running: the moon inside the eye turns violet and a live countdown such as 3:59:41 ticks beside it; clicking the eye or the countdown lets you enter more time. Three, end early: press and hold the small x beside the countdown while a ring fills over 0.6 seconds; let go early and nothing happens. Closing the lid is optional. Caveat: recovery can need attention, because Insomnia restores only what it can verify, so check the right-click menu after a session.</desc>
  <style>
    svg { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Helvetica, Arial, sans-serif; }
    .bg { fill: #F4F3FA; }
    .t { fill: #11151F; }
    .m { fill: #4F5368; }
    .a { fill: #9691D9; }
    .ln { fill: none; stroke: #9691D9; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    .hdr { fill: none; stroke: #11151F; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    .hdr-moon { fill: #11151F; }
    .warn { fill: #A85A00; }
    .warn-ic { fill: none; stroke: #A85A00; stroke-width: 2.25; stroke-linecap: round; stroke-linejoin: round; }
    /* Menu bar excerpt. The bar is drawn dark in both schemes, like a dark
       menu bar over a wallpaper; the pills themselves are always charcoal. */
    .bar { fill: #1C1C21; stroke: #FFFFFF; stroke-opacity: 0.08; stroke-width: 1.5; }
    .eye { fill: none; stroke: #FFFFFF; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    .moon { fill: #FFFFFF; }
    .moon-on { fill: #9691D9; }
    .pill { fill: #11151F; fill-opacity: 0.92; stroke: #FFFFFF; stroke-opacity: 0.10; stroke-width: 0.9; }
    .pill-ph { fill: #FFFFFF; fill-opacity: 0.42; }
    .focus { fill: none; stroke: #9691D9; stroke-width: 2.7; }
    .count { fill: #FFFFFF; }
    .track { fill: none; stroke: #FFFFFF; stroke-opacity: 0.14; stroke-width: 2.9; }
    .prog { fill: none; stroke: #9691D9; stroke-width: 2.9; stroke-linecap: round; }
    .x { fill: none; stroke: #FFFFFF; stroke-opacity: 0.85; stroke-width: 2.6; stroke-linecap: round; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #06012C; }
      .t { fill: #EEF0F7; }
      .m { fill: #B4B8CC; }
      .a { fill: #9691D9; }
      .ln { stroke: #9691D9; }
      .hdr { stroke: #EEF0F7; }
      .hdr-moon { fill: #EEF0F7; }
      .warn { fill: #F2A854; }
      .warn-ic { stroke: #F2A854; }
      .bar { fill: #1C1C21; }
    }
  </style>
  <defs>
    <!-- EyeMoonGeometry on its 24-unit grid; colour comes from the referencing use element. -->
    <path id="sf-eye" d="M1.5 12 C7 4.5 17 4.5 22.5 12 C17 19.5 7 19.5 1.5 12 Z"/>
    <path id="sf-moon" d="M13.3625 8.1877 A4.2 4.2 0 1 0 13.3625 15.8123 A3.85 3.85 0 0 1 13.3625 8.1877 Z"/>
    <marker id="sf-arrow" viewBox="0 0 14 14" markerWidth="14" markerHeight="14" refX="11" refY="7" markerUnits="userSpaceOnUse" orient="auto">
      <path class="a" d="M2 2 L12 7 L2 12 Z"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="880" height="600" rx="24"/>

  <!-- Header: the mark at 40 px -->
  <g transform="translate(40 24) scale(1.6667)">
    <use href="#sf-eye" class="hdr"/>
    <use href="#sf-moon" class="hdr-moon"/>
  </g>
  <text class="t" x="96" y="52" font-size="26" font-weight="700">A timed awake session</text>
  <text class="m" x="96" y="82" font-size="20">Everything happens in the menu bar. Closing the lid is optional.</text>

  <!-- 1. Enter a duration -->
  <text class="t" x="40" y="150" font-size="24" font-weight="700">1. Enter a duration</text>
  <text class="m" x="40" y="182" font-size="20">Click the eye: three pills appear,</text>
  <text class="m" x="40" y="208" font-size="20">Hours focused. Type digits; Tab or</text>
  <text class="m" x="40" y="234" font-size="20">the arrow keys move on. Enter starts.</text>
  <g>
    <rect class="bar" x="416" y="146" width="424" height="56" rx="12"/>
    <!-- 17 pt mark drawn at 1.8x = 30.6 px, centred in the 36 px icon box -->
    <g transform="translate(430 158.7) scale(1.275)">
      <use href="#sf-eye" class="eye"/>
      <use href="#sf-moon" class="moon"/>
    </g>
    <rect class="pill" x="478" y="157" width="80" height="34" rx="12.6"/>
    <text class="pill-ph" x="518" y="182" font-size="22" text-anchor="middle">Days</text>
    <rect class="pill" x="570" y="157" width="92" height="34" rx="12.6"/>
    <rect class="focus" x="571.4" y="158.4" width="89.2" height="31.2" rx="11.2"/>
    <text class="pill-ph" x="616" y="182" font-size="22" text-anchor="middle">Hours</text>
    <rect class="pill" x="674" y="157" width="116" height="34" rx="12.6"/>
    <text class="pill-ph" x="732" y="182" font-size="22" text-anchor="middle">Minutes</text>
  </g>

  <!-- 2. Running -->
  <text class="t" x="40" y="280" font-size="24" font-weight="700">2. Running</text>
  <text class="m" x="40" y="312" font-size="20">The moon turns violet and the</text>
  <text class="m" x="40" y="338" font-size="20">countdown ticks. Click the eye or the</text>
  <text class="m" x="40" y="364" font-size="20">countdown to enter more time.</text>
  <g>
    <rect class="bar" x="416" y="276" width="424" height="56" rx="12"/>
    <g transform="translate(430 288.7) scale(1.275)">
      <use href="#sf-eye" class="eye"/>
      <use href="#sf-moon" class="moon-on"/>
    </g>
    <text class="count" x="478" y="312" font-size="24" font-weight="500">3:59:41</text>
    <g transform="translate(580 304)">
      <circle class="track" cx="0" cy="0" r="14.5"/>
      <path class="x" d="M-4.5 -4.5 L4.5 4.5 M4.5 -4.5 L-4.5 4.5"/>
    </g>
  </g>

  <!-- 3. End early -->
  <text class="t" x="40" y="410" font-size="24" font-weight="700">3. End early</text>
  <text class="m" x="40" y="442" font-size="20">Press and hold the x: a ring fills over</text>
  <text class="m" x="40" y="468" font-size="20">0.6 seconds, then the session ends.</text>
  <text class="m" x="40" y="494" font-size="20">Let go early and nothing happens.</text>
  <g>
    <rect class="bar" x="416" y="406" width="424" height="56" rx="12"/>
    <g transform="translate(430 418.7) scale(1.275)">
      <use href="#sf-eye" class="eye"/>
      <use href="#sf-moon" class="moon-on"/>
    </g>
    <text class="count" x="478" y="442" font-size="24" font-weight="500">3:59:40</text>
    <!-- held: scaled 1.12, ring about 60% drawn from the top, clockwise -->
    <g transform="translate(580 434) scale(1.12)">
      <circle class="track" cx="0" cy="0" r="14.5"/>
      <path class="prog" d="M0 -14.5 A14.5 14.5 0 1 1 -8.52 11.73"/>
      <path class="x" d="M-4.5 -4.5 L4.5 4.5 M4.5 -4.5 L-4.5 4.5"/>
    </g>
    <path class="ln" d="M612 434 H640" marker-end="url(#sf-arrow)"/>
    <text class="a" x="650" y="441" font-size="20" font-weight="600">Hold, don't click</text>
  </g>

  <!-- Caveat -->
  <g class="warn-ic">
    <path d="M53 536 L66 560 H40 Z"/>
    <path d="M53 544 V552"/>
    <path d="M53 556 V556.5"/>
  </g>
  <text class="warn" x="78" y="549" font-size="20" font-weight="700">Recovery can need attention.</text>
  <text class="m" x="78" y="577" font-size="20">Insomnia restores only what it can verify. Check the right-click menu after a session.</text>
</svg>
