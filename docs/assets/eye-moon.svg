<svg xmlns="http://www.w3.org/2000/svg" width="112" height="112" viewBox="100 100 824 824" role="img" aria-labelledby="em-title em-desc">
  <title id="em-title">Insomnia</title>
  <desc id="em-desc">The Insomnia mark: an almond-shaped eye outline containing a solid crescent moon whose opening and tips face right, drawn in moon-white on a midnight-blue rounded tile.</desc>
  <!-- Same layout as the app icon: an 824-unit tile inset 100 units in a 1024 canvas, corners at 22.37% of the tile, the 24-unit mark grid at 76% of the tile side. -->
  <rect x="100" y="100" width="824" height="824" rx="184.33" fill="#06012C"/>
  <!-- EyeMoonGeometry, verbatim on its 24-unit grid: two cubic lids, then the crescent as one closed subpath (outer arc around the left, bite arc back). -->
  <g transform="translate(198.88 198.88) scale(26.0933)">
    <path d="M1.5 12 C7 4.5 17 4.5 22.5 12 C17 19.5 7 19.5 1.5 12 Z" fill="none" stroke="#EEF0F7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M13.3625 8.1877 A4.2 4.2 0 1 0 13.3625 15.8123 A3.85 3.85 0 0 1 13.3625 8.1877 Z" fill="#EEF0F7"/>
  </g>
</svg>
